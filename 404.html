<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Página no encontrada · SAT Studio</title>
    <meta name="robots" content="noindex" />
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0; min-height: 100dvh; display: grid; place-items: center;
        font: 16px/1.6 system-ui, sans-serif; background: #f7f6f3; color: #1d2230;
        padding: 24px; text-align: center;
      }
      main { max-width: 34rem; }
      h1 { font-size: clamp(2rem, 8vw, 3rem); margin: 0 0 .5rem; letter-spacing: -.02em; }
      p { color: #5b6172; margin: 0 0 2rem; }
      a {
        display: inline-block; min-height: 44px; padding: 11px 22px;
        background: #1d2230; color: #fff; text-decoration: none; border-radius: 4px;
      }
      a:focus-visible { outline: 3px solid #1d2230; outline-offset: 3px; }
      @media (prefers-color-scheme: dark) {
        body { background: #12151c; color: #e9ecf2; }
        p { color: #a2a9b8; }
        a { background: #e9ecf2; color: #12151c; }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Esta página no existe</h1>
      <p>El link que seguiste está roto o la página se movió.</p>
      <a href="/">Volver al inicio</a>
    </main>
  </body>
</html>
